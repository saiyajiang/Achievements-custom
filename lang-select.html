<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择语言 / Select Language</title>
    <style>
      :root {
        --bg: #1e1f29;
        --panel: #282a36;
        --panel-hover: #343746;
        --border: #44475a;
        --text: #f8f8f2;
        --muted: #a3a6b8;
        --accent: #bd93f9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei",
          "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
        overflow: hidden;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 22px 24px 18px;
      }
      .head {
        flex: 0 0 auto;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .sub {
        margin: 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .list {
        flex: 1 1 auto;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 6px;
      }
      .list::-webkit-scrollbar {
        width: 9px;
      }
      .list::-webkit-scrollbar-thumb {
        background: #44475a;
        border-radius: 5px;
      }
      .item {
        width: 100%;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 9px 12px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        text-align: left;
        transition: background 0.12s ease;
      }
      .item:hover {
        background: var(--panel-hover);
      }
      .item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .item.current {
        background: var(--panel-hover);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .item .native {
        font-weight: 600;
      }
      .item .en {
        font-size: 11.5px;
        color: var(--muted);
      }
      .item .tag {
        margin-left: auto;
        font-size: 11px;
        color: var(--accent);
      }
      .foot {
        flex: 0 0 auto;
        margin-top: 12px;
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <h1>选择界面语言</h1>
        <p class="sub">
          Choose your interface language · 之后可在「设置 → 常规」中随时更改
        </p>
      </div>
      <div class="list" id="list"></div>
      <div class="foot">
        点击任意语言即可开始使用。此选项同时会设为成就文本的默认语言。
      </div>
    </div>

    <script>
      // 语言代码 -> [本地名, 英文说明]
      var NAMES = {
        schinese: ["简体中文", "Simplified Chinese"],
        tchinese: ["繁體中文", "Traditional Chinese"],
        english: ["English", "English"],
        japanese: ["日本語", "Japanese"],
        koreana: ["한국어", "Korean"],
        russian: ["Русский", "Russian"],
        german: ["Deutsch", "German"],
        french: ["Français", "French"],
        spanish: ["Español", "Spanish"],
        latam: ["Español (Latinoamérica)", "Spanish (Latin America)"],
        brazilian: ["Português (Brasil)", "Portuguese (Brazil)"],
        portuguese: ["Português", "Portuguese"],
        italian: ["Italiano", "Italian"],
        polish: ["Polski", "Polish"],
        turkish: ["Türkçe", "Turkish"],
        ukrainian: ["Українська", "Ukrainian"],
        czech: ["Čeština", "Czech"],
        swedish: ["Svenska", "Swedish"],
        danish: ["Dansk", "Danish"],
        finnish: ["Suomi", "Finnish"],
        norwegian: ["Norsk", "Norwegian"],
        dutch: ["Nederlands", "Dutch"],
        greek: ["Ελληνικά", "Greek"],
        romanian: ["Română", "Romanian"],
        hungarian: ["Magyar", "Hungarian"],
        indonesian: ["Bahasa Indonesia", "Indonesian"],
        thai: ["ไทย", "Thai"],
        vietnamese: ["Tiếng Việt", "Vietnamese"],
        arabic: ["العربية", "Arabic"],
        bulgarian: ["Български", "Bulgarian"],
      };
      var PRIORITY = ["schinese", "english", "tchinese", "japanese", "russian"];

      function label(code) {
        var n = NAMES[code];
        return n ? n[0] : code;
      }
      function englishOf(code) {
        var n = NAMES[code];
        return n ? n[1] : code;
      }
      function sortLangs(list) {
        var arr = list.slice();
        arr.sort(function (a, b) {
          var ia = PRIORITY.indexOf(a);
          var ib = PRIORITY.indexOf(b);
          if (ia !== -1 && ib !== -1) return ia - ib;
          if (ia !== -1) return -1;
          if (ib !== -1) return 1;
          return label(a).localeCompare(label(b));
        });
        return arr;
      }

      function submit(code) {
        try {
          if (window.api && typeof window.api.selectStartupUiLanguage === "function") {
            window.api.selectStartupUiLanguage(code);
            return;
          }
        } catch (e) {}
        // 兜底：无 preload 时直接关闭窗口，使用默认语言
        try {
          window.close();
        } catch (e) {}
      }

      function render(langs, current) {
        var box = document.getElementById("list");
        box.innerHTML = "";
        sortLangs(langs).forEach(function (code) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "item" + (code === current ? " current" : "");
          var native = document.createElement("span");
          native.className = "native";
          native.textContent = label(code);
          var en = document.createElement("span");
          en.className = "en";
          en.textContent = englishOf(code);
          btn.appendChild(native);
          btn.appendChild(en);
          if (code === current) {
            var tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = "当前 / current";
            btn.appendChild(tag);
          }
          btn.addEventListener("click", function () {
            submit(code);
          });
          box.appendChild(btn);
        });
      }

      (function boot() {
        var fallback = ["schinese", "english", "tchinese", "japanese"];
        var current = "schinese";
        var langs = fallback;
        try {
          if (
            window.api &&
            typeof window.api.getUiLanguageOptions === "function"
          ) {
            var p = window.api.getUiLanguageOptions();
            Promise.resolve(p)
              .then(function (r) {
                if (r && Array.isArray(r.languages) && r.languages.length) {
                  langs = r.languages;
                }
                if (r && r.current) current = r.current;
                render(langs, current);
              })
              .catch(function () {
                render(langs, current);
              });
            return;
          }
        } catch (e) {}
        render(langs, current);
      })();
    </script>
  </body>
</html>
